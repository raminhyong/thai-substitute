    // Format an ISO date string (YYYY-MM-DD) into short Thai form e.g. "15 มิ.ย. 2569"
    const THAI_MONTHS_SHORT = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const THAI_MONTHS_FULL = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    function formatThaiDateShort(dateStr) {
      if (!dateStr) return "-";
      const parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      const [y, m, d] = parts;
      const day = parseInt(d, 10);
      const monthIdx = parseInt(m, 10) - 1;
      const buddhistYear = parseInt(y, 10) + 543;
      const month = THAI_MONTHS_SHORT[monthIdx] || "";
      if (!day || !month || !buddhistYear) return dateStr;
      return `${day} ${month} ${buddhistYear}`;
    }

    function formatThaiMonthYear(monthValue) {
      if (!/^\d{4}-\d{2}$/.test(monthValue || "")) return "เดือนที่เลือก";
      const [year, month] = monthValue.split("-").map(Number);
      return `${THAI_MONTHS_FULL[month - 1] || ""} ${year + 543}`;
    }

    // Group flat database rows into structured history object array
    function groupRowsToHistory(flatRows) {
      if (!Array.isArray(flatRows)) return [];
      const groups = {};
      
      flatRows.forEach(row => {
        const id = row.id;
        if (!id) return;
        
        if (!groups[id]) {
          let dateStr = row.date;
          if (dateStr && dateStr.includes("T")) {
            dateStr = dateStr.split("T")[0];
          }
          
          groups[id] = {
            id: id,
            date: dateStr,
            day: row.day || "",
            absentTeacherId: row.absentTeacherId || "",
            absentTeacherName: row.absentTeacherName || "ไม่ระบุ",
            reason: row.reason || "",
            workType: row.workType || "ภาษาไทย",
            substitutes: []
          };
        }
        
        groups[id].substitutes.push({
          period: parseInt(row.period),
          subject: row.subject || "",
          subjectCode: row.subjectCode || "",
          class: row.class || "",
          room: row.room || "",
          subTeacherId: row.subTeacherId || "",
          subTeacherName: row.subTeacherName || "ไม่ระบุ"
        });
      });
      
      return Object.values(groups).sort((a, b) => b.id.localeCompare(a.id));
    }

      const sendApiRequest = async (payload) => {
        if (isAppsScriptEnv) {

            if (payload.action === "save") {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .saveSubstitution(payload.data);
            } else if (payload.action === "updateSubstitute") {

                .withFailureHandler(reject)
                .updateSubstituteTeacher(
                  payload.id,
                  payload.period,
                  payload.subTeacherId,

                );
            } else if (payload.action === "delete") {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .deleteSubstitution(payload.id);
            } else if (payload.action === "typesafeAdvisory") {
              // TypeSafe (Jev) — "ความเห็นที่สอง" เท่านั้น ไม่แทนที่การตัดสินใจของครู
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .apiTypeSafeAdvisory(payload.data);
            } else {
              reject(new Error("Unknown action"));
            }
          });
        } else {
          const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)

          if (sub.includes("คุณธรรม")) return false;
          // 3. คาบลูกเสือ / เนตรนารี
          if (sub.includes("ลูกเสือ") || sub.includes("เนตรนารี")) return false;
          // 4. คาบ IS (วิชาตระกูล I..... หรือวิชาที่ขึ้นต้นด้วย 1 เป็นรหัส typo)
          if (sub.startsWith("I") || sub.startsWith("i") || sub.startsWith("1")) return false;
          // 5. คาบกิจกรรมพัฒนาผู้เรียน / แนะแนว (ขึ้นต้นด้วย ก..... เช่น ก22904)
          if (sub.startsWith("ก") && sub.length > 1) return false;
          // 6. คาบประชุม / PLC / ชุมนุม
          if (sub.includes("ประชุม") || sub.toUpperCase().includes("PLC") || sub.includes("ชุมนุม")) return false;

          return true;
        }).sort((a, b) => a.period - b.period);
      }, [absentTeacherId, selectedDay]);

      // Recommend substitutes using availability, daily load and compact schedules.
      //
      // กติกาหลัก (ปรับปรุง 2569): "ความเป็นธรรมเรื่องภาระต้องมาก่อนความสวยงามของตาราง"
      //   1) ครูที่ว่างในคาบนั้นมาก่อนเสมอ
      //   2) ในบรรดาครูที่ว่าง พิจารณาเฉพาะกลุ่มที่ "ภาระจริง" เบาสุด +1 คาบ (เพดานความเป็นธรรม)
      //   3) ภายในกลุ่มนั้นจึงใช้คะแนน (คาบติดกัน/ภารกิจพิเศษ/สถิติสะสม) ตัดสิน
      //   เหตุผล: เดิมโบนัส "คาบติดกัน" เท่ากับ 5 คาบสอน ทำให้เสนอครูที่งานหนักกว่าคนว่าง
      const BAND_TOLERANCE = 1;

      const getRecommendationsForPeriod = (period, currentDayDraft) => {
        if (!absentTeacherId) return [];

        let candidates = TEACHERS_DB.filter(t => t.id !== absentTeacherId);

        const scored = candidates.map(teacher => {
          const daySchedule = teacher.schedule[selectedDay] || [];
          const regularPeriods = new Set(daySchedule.map(slot => slot.period));
          const draftSubPeriods = Object.entries(currentDayDraft)
            .filter(([p, id]) => parseInt(p) !== period && id === teacher.id && id !== "__SWAPPED__")
            .map(([p]) => parseInt(p));
          const occupiedBefore = new Set([...regularPeriods, ...draftSubPeriods]);
          const isTeaching = regularPeriods.has(period);
          const isFree = !isTeaching;
          const alreadyAssignedToday = draftSubPeriods.length > 0;
          const dailyRegularLoad = regularPeriods.size;
          const draftSubCount = draftSubPeriods.length;
          const dailyTotalLoad = dailyRegularLoad + draftSubCount;

          const crossesLunchBreak = (a, b) => (a === 5 && b === 6) || (a === 6 && b === 5);
          const adjacentPeriods = [period - 1, period + 1]
            .filter(p => p >= 0 && p <= 10 && !crossesLunchBreak(period, p));
          const adjacentRegular = adjacentPeriods.filter(p => regularPeriods.has(p));
          const adjacentSub = adjacentPeriods.filter(p => draftSubPeriods.includes(p));
          const bridgesGap = adjacentPeriods.length === 2 && adjacentPeriods.every(p => occupiedBefore.has(p));

          const occupiedAfter = new Set([...occupiedBefore, period]);
          let maxConsecutiveAfter = 0;
          let currentRun = 0;
          for (let p = 0; p <= 10; p++) {
            if (occupiedAfter.has(p)) {
              currentRun++;
              maxConsecutiveAfter = Math.max(maxConsecutiveAfter, currentRun);
            } else {
              currentRun = 0;
            }
          }

          let score = isFree ? 1000 : -10000;
          let reasons = [];

          if (!isFree) {
            reasons.push("❌ ติดสอนคาบนี้ (จัดแทนได้หากจำเป็น)");
          } else {
            reasons.push("ว่างคาบนี้");
          }

          // ── น้ำหนักคะแนน (ปรับปรุง 2569) ────────────────────────────────────
          // ปัญหาเดิม: "คาบติดกัน" ให้โบนัสถึง +110 เทียบเท่าคาบสอน 5 คาบ
          //            → ครูที่งานหนักกว่าถูกเสนอแทนครูที่ว่างกว่า (ขัดหลักความเป็นธรรม)
          // แนวทางใหม่: "ภาระ" เป็นตัวชี้ขาด · "คาบติดกัน" เป็นเพียงตัวตัดสินรอง
          //            (เพดานความเป็นธรรมถูกบังคับใช้ที่ขั้นตอนจัดอันดับด้านล่าง)
          score -= dailyRegularLoad * 30;
          score -= draftSubCount * 34;
          reasons.push(`ภาระวันนี้ ${dailyTotalLoad} คาบ (ประจำ ${dailyRegularLoad} + แทน ${draftSubCount})`);

          if (bridgesGap) {
            score += 25;
            reasons.push("เชื่อมคาบว่างระหว่างคาบสอน (ตัวตัดสินรอง)");
          } else if (adjacentSub.length > 0) {
            score += 22;
            reasons.push(`ต่อเนื่องกับคาบสอนแทน ${adjacentSub.join(", ")} (ตัวตัดสินรอง)`);
          } else if (adjacentRegular.length > 0) {
            score += 15;
            reasons.push(`ต่อเนื่องกับคาบสอนประจำ ${adjacentRegular.join(", ")} (ตัวตัดสินรอง)`);
          } else if (alreadyAssignedToday) {
            score -= 90;
            reasons.push("หลีกเลี่ยงการจัดสอนแทนแบบคาบเว้นคาบ");
          }

          if (maxConsecutiveAfter >= 4) {
            score -= (maxConsecutiveAfter - 3) * 95;
            reasons.push(`ภาระต่อเนื่องจะเป็น ${maxConsecutiveAfter} คาบ`);
          }

          if (teacher.isSpecialHead) {
            score -= 55;
            reasons.push("⭐⭐ มีภารกิจหัวหน้างานพิเศษ (ตัวเลือกท้ายสุด)");
          }

          const prevSubsCount = subCounts[teacher.id] || 0;
          score -= (prevSubsCount * 20);
          if (prevSubsCount > 0) {
            reasons.push(`เคยสอนแทนสะสม ${prevSubsCount} คาบ`);
          } else {
            reasons.push("ยังไม่เคยช่วยสอนแทน");
          }

          const teachesPeriod5 = regularPeriods.has(5) || currentDayDraft[5] === teacher.id;
          const teachesPeriod6 = regularPeriods.has(6) || currentDayDraft[6] === teacher.id;
          const isLunchConflict = (period === 5 && teachesPeriod6) || (period === 6 && teachesPeriod5);

          if (isLunchConflict) {
            score -= 200;
            reasons.push("🍔 ต้องการเวลาพักเที่ยง (ติดสอนคาบข้างเคียง)");
          }

          const currentClass = currentAbsentSchedule.find(c => c.period === period);
          if (currentClass) {
            const absentGrade = currentClass.class.split('/')[0];
            const teachesSameGrade = (Object.values(teacher.schedule || {}).flat())
              .some(c => c.class.startsWith(absentGrade));

            if (teachesSameGrade) {
              score += 15;
              reasons.push(`สอนสายชั้น ${absentGrade} เช่นกัน`);
            }
          }

          // ภาระจริง = คาบสอนประจำ + คาบสอนแทนที่จัดให้ไปแล้วในวันนี้
          // ใช้เป็นฐานของ "เพดานความเป็นธรรม" เพื่อไม่ให้เทงานซ้ำใส่ครูคนเดิม
          const effectiveLoad = dailyRegularLoad + draftSubCount;

          return {
            ...teacher,
            isFree,
            alreadyAssignedToday,
            score,
            reasons,
            prevSubsCount,
            isLunchConflict,
            dailyRegularLoad,
            draftSubCount,
            dailyTotalLoad,
            effectiveLoad,
            adjacentRegular,
            adjacentSub,
            bridgesGap,
            maxConsecutiveAfter
          };
        });

        // ── เพดานความเป็นธรรม (Fairness band) ──────────────────────────────
        // หา "ภาระจริง" ที่เบาสุดในกลุ่มครูที่ว่าง แล้วให้สิทธิ์เฉพาะกลุ่มที่เบาสุด +1 คาบ
        // เพื่อรับประกันว่าโบนัส "คาบติดกัน" จะไม่มีทางเอาชนะเรื่องภาระได้อีก
        const freeEffectiveLoads = scored.filter(c => c.isFree).map(c => c.effectiveLoad);
        const minFreeEffectiveLoad = freeEffectiveLoads.length ? Math.min(...freeEffectiveLoads) : null;

        return scored
          .map(c => {
            const withinFairnessBand =
              c.isFree && minFreeEffectiveLoad !== null &&
              c.effectiveLoad <= minFreeEffectiveLoad + BAND_TOLERANCE;

            // อธิบายให้ผู้ใช้เห็นว่าทำไมถูกจัดลำดับรอง (ความโปร่งใส — ครูต้องตรวจสอบได้)
            let bandReasons = c.reasons;
            if (c.isFree && !withinFairnessBand && minFreeEffectiveLoad !== null) {
              bandReasons = c.reasons.concat([
                `จัดลำดับรอง: ภาระจริง ${c.effectiveLoad} คาบ มากกว่าคนที่เบาสุด (${minFreeEffectiveLoad} คาบ) เกิน ${BAND_TOLERANCE} คาบ`
              ]);
            }
            return { ...c, withinFairnessBand, reasons: bandReasons };
          })
          .sort((a, b) => {
            // 1) ครูที่ว่างในคาบนั้นมาก่อนเสมอ
            if (a.isFree !== b.isFree) return a.isFree ? -1 : 1;
            // 2) เพดานความเป็นธรรม — กลุ่มที่ภาระเบากว่ามาก่อน
            if (a.withinFairnessBand !== b.withinFairnessBand) return a.withinFairnessBand ? -1 : 1;
            // 3) ภายในกลุ่มเดียวกันจึงใช้คะแนน และตัวตัดสินสำรองตามเดิม
            return (
              b.score - a.score ||
              a.dailyTotalLoad - b.dailyTotalLoad ||
              a.prevSubsCount - b.prevSubsCount ||
              a.name.localeCompare(b.name, "th")
            );
          });
      };

      // ─── TypeSafe (Jev) — "ความเห็นที่สอง" ─────────────────────────────────
      // หลักการ: ระบบเดิมยังเสนอหลักเสมอ · Jev ให้ความเห็นเพิ่มเติม · ครูเป็นผู้ตัดสินใจขั้นสุดท้าย
      const requestAdvisory = async (period) => {
        const recs = getRecommendationsForPeriod(period, currentSelections);
        const freeRecs = recs.filter(r => r.isFree).slice(0, 8);

        if (!freeRecs.length) {
          showToast("คาบนี้ไม่มีครูว่าง จึงขอความเห็นที่สองไม่ได้", "warning");
          return;
        }

        const absent = TEACHERS_DB.find(t => t.id === absentTeacherId);
        const slot = currentAbsentSchedule.find(c => c.period === period);
        const absentGrade = slot && slot.class ? String(slot.class).split("/")[0] : "";

        // ส่งข้อมูลจริงของระบบให้ Jev: คาบสอนวันนั้น + สถิติสอนแทนสะสม + ภารกิจพิเศษ + เคยสอนสายชั้น
        const candidates = freeRecs.map(r => {
          const t = TEACHERS_DB.find(x => x.id === r.id);
          const taughtGrade = absentGrade
            ? Object.values((t && t.schedule) || {}).flat().some(c => String(c.class).startsWith(absentGrade))
            : false;
          return {
            name: r.name,
            periodsThatDay: r.dailyTotalLoad,
            subStats: r.prevSubsCount,
            isSpecialHead: !!(t && t.isSpecialHead),
            taughtGrade
          };
        });

        setAdvisory(prev => ({ ...prev, [period]: { loading: true } }));

        try {
          const data = await sendApiRequest({
            action: "typesafeAdvisory",
            data: {
              situation: {
                absent: absent ? absent.name : "-",
                day: selectedDay,
                period: period,
                subject: slot ? slot.subject : "-",
                className: slot ? slot.class : "-",
                systemPick: freeRecs[0] ? freeRecs[0].name : ""
              },
              candidates: candidates
            }
          });
          setAdvisory(prev => ({ ...prev, [period]: { loading: false, result: data } }));
        } catch (err) {
          setAdvisory(prev => ({
            ...prev,
            [period]: { loading: false, error: String(err && err.message ? err.message : err) }
          }));
        }
      };

      // Helper to calculate daily workload and consecutive periods for a teacher
      const getTeacherDayStatus = (teacherId, day, periodBeingScheduled, currentSelections) => {
        const teacher = TEACHERS_DB.find(t => t.id === teacherId);
        if (!teacher) return null;

        // Find regular classes for this day
        const regularClasses = teacher.schedule[day] || [];

        // Find other substitutions assigned to this teacher today (excluding swapped)
        const otherSubs = Object.entries(currentSelections)
          .filter(([p, id]) => parseInt(p) !== periodBeingScheduled && id === teacherId && id !== "__SWAPPED__")
          .map(([p]) => parseInt(p));

        // Determine status for each period 0 to 10
        const periodsStatus = Array.from({ length: 11 }, (_, p) => {
          const regular = regularClasses.find(slot => slot.period === p);
          const isThisSub = p === periodBeingScheduled;
          const isOtherSub = otherSubs.includes(p);

          let status = "free"; // free, regular, otherSub, thisSub
          let label = "ว่าง";
          let detail = "";

          if (regular) {
            status = "regular";
            label = "สอน";
            detail = `สอนวิชา ${regular.subject} ห้อง ${regular.class} (${regular.room})`;
          } else if (isThisSub) {
            status = "thisSub";
            label = "แทน";
            detail = `จัดสอนแทนคาบนี้`;
          } else if (isOtherSub) {
            status = "otherSub";
            label = "แทน";
            detail = `สอนแทนคาบอื่นวันนี้`;
          }

          return { period: p, status, label, detail };
        });

        // Calculate consecutive periods
        let maxConsecutive = 0;
        let currentConsecutive = 0;
        let consecutiveRanges = [];
        let tempRange = [];

        periodsStatus.forEach(p => {
          if (p.status !== "free") {
            currentConsecutive++;
            tempRange.push(p.period);
          } else {
            if (currentConsecutive > 0) {
              if (currentConsecutive > maxConsecutive) {
                maxConsecutive = currentConsecutive;
              }
              consecutiveRanges.push([...tempRange]);
              tempRange = [];
            }
            currentConsecutive = 0;
          }
        });
        if (currentConsecutive > 0) {
          if (currentConsecutive > maxConsecutive) {
            maxConsecutive = currentConsecutive;
          }
          consecutiveRanges.push([...tempRange]);
        }

        // Find the range containing the current periodBeingScheduled to highlight it
        const affectedRange = consecutiveRanges.find(range => range.includes(periodBeingScheduled)) || [];

        // Count free periods out of 11
        const freeCount = periodsStatus.filter(p => p.status === "free").length;

        return {
          periodsStatus,
          maxConsecutive,
          consecutiveRanges,
          affectedRange,
          freeCount
        };
      };

      // Reset the selection draft when teacher, day or date changes
      useEffect(() => {
        const initialSelections = {};
        [...currentAbsentSchedule]
          .sort((a, b) => a.period - b.period)
          .forEach(slot => {
            const recs = getRecommendationsForPeriod(slot.period, initialSelections);
            const bestFree = recs.find(r => r.isFree && !r.isLunchConflict) || recs.find(r => r.isFree);
            initialSelections[slot.period] = bestFree ? bestFree.id : "";
          });
        setCurrentSelections(initialSelections);
      }, [absentTeacherId, selectedDay, selectedDate, history]);

      // Handle change of substitute for a specific period
      const handleSubChange = (period, subTeacherId) => {
        setCurrentSelections(prev => ({
          ...prev,
          [period]: subTeacherId
        }));
      };

      // Save the current draft of substitutions into history
      const handleSaveSubstitution = async () => {
        if (currentAbsentSchedule.length === 0) return;

        const substitutesList = currentAbsentSchedule.map(slot => {
          const subId = currentSelections[slot.period];
          const subTeacher = TEACHERS_DB.find(t => t.id === subId);
          const isSwapped = subId === "__SWAPPED__";
          return {
            period: slot.period,
            subject: slot.subject,
            class: slot.class,
            room: slot.room,
            subTeacherId: subId,
            subTeacherName: isSwapped ? "แลกคาบแล้ว" : (subTeacher ? subTeacher.name : "ไม่ได้ระบุ")
          };
        });

        const absentTeacher = TEACHERS_DB.find(t => t.id === absentTeacherId);

        const newRecord = {
          id: "sub-" + Date.now(),
          date: selectedDate,
          day: selectedDay,
          absentTeacherId,
          absentTeacherName: absentTeacher ? absentTeacher.name : "ไม่ระบุ",
          reason: leaveReason,
          substitutes: substitutesList
        };

        setIsLoading(true);
        try {
          const res = await sendApiRequest({
            action: "save",
            data: newRecord
          });

          if (res && res.status === "success") {
            setHistory(prev => [newRecord, ...prev]);
            showToast("บันทึกข้อมูลการจัดสอนแทนลงประวัติสำเร็จแล้ว!", "success");
            setActiveTab("history");
          } else {
            throw new Error(res?.message || "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง");
          }
        } catch (error) {
          console.error("Failed to save via Apps Script:", error);
          // Fallback: Save to local state history and localStorage if server save fails
          setHistory(prev => {
            const updated = [newRecord, ...prev];
            localStorage.setItem("sub_history", JSON.stringify(updated));
            return updated;
          });
          showToast("⚠️ เชื่อมต่อ Google Sheets ล้มเหลว บันทึกข้อมูลสำเร็จเฉพาะในเครื่องนี้แล้ว!", "warning");
          setActiveTab("history");
        } finally {
          setIsLoading(false);
        }
      };

      const handleSaveAcademicSubstitution = async () => {
        const period = Number(academicPeriod);
        const subTeacher = TEACHERS_DB.find(t => t.id === academicTeacherId);
        if (!selectedDate || !period || !subTeacher) {
          showToast("กรุณาเลือกวันที่ คาบ และครูผู้สอนแทนให้ครบ", "warning");
          return;
        }

        const newRecord = {
          id: "academic-" + Date.now(),
          date: selectedDate,
          day: selectedDay,
          absentTeacherId: "000",
          absentTeacherName: "วิชาการ",
          reason: "สอนแทนวิชาการ",
          workType: "วิชาการ",
          substitutes: [{
            period,
            subject: "วิชาการ",
            subjectCode: "000",
            class: "000",
            room: "000",
            subTeacherId: subTeacher.id,
            subTeacherName: subTeacher.name
          }]
        };

        setIsLoading(true);
        try {
          const res = await sendApiRequest({ action: "save", data: newRecord });
          if (!res || res.status !== "success") throw new Error(res?.message || "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง");
          setHistory(prev => [newRecord, ...prev]);
          setAcademicTeacherId("");
          showToast("บันทึกสอนแทนวิชาการและเพิ่มสถิติรายครูเรียบร้อยแล้ว!", "success");
          setActiveTab("history");
        } catch (error) {
          console.error("Failed to save academic substitution:", error);
          setHistory(prev => {
            const updated = [newRecord, ...prev];
            localStorage.setItem("sub_history", JSON.stringify(updated));
            return updated;
          });
          setAcademicTeacherId("");
          showToast("⚠️ บันทึกวิชาการไว้เฉพาะในเครื่องนี้ เนื่องจากเชื่อมต่อ Google Sheets ไม่สำเร็จ", "warning");
          setActiveTab("history");
        } finally {
          setIsLoading(false);
        }
      };

      const openSubstituteEditor = (record, sub) => {
        setEditSubstituteTarget({
          recordId: record.id,
          absentTeacherId: record.absentTeacherId,
          absentTeacherName: record.absentTeacherName,
          date: record.date,
          day: record.day,
          period: sub.period,
          className: sub.class,
          subject: sub.subject,
          currentTeacherId: sub.subTeacherId,
          currentTeacherName: sub.subTeacherName
        });
        setReplacementTeacherId("");
      };

      const executeSubstituteUpdate = async () => {
        if (!editSubstituteTarget || !replacementTeacherId) {
          showToast("กรุณาเลือกครูผู้สอนแทนคนใหม่", "warning");
          return;
        }

        const replacementTeacher = TEACHERS_DB.find(teacher => teacher.id === replacementTeacherId);
        if (!replacementTeacher) {
          showToast("ไม่พบข้อมูลครูที่เลือก", "warning");
          return;
        }
        if (replacementTeacherId === editSubstituteTarget.currentTeacherId) {
          showToast("กรุณาเลือกครูคนใหม่ที่ต่างจากคนเดิม", "warning");
          return;
        }

        setIsLoading(true);
        try {
          const res = await sendApiRequest({
            action: "updateSubstitute",
            id: editSubstituteTarget.recordId,
            period: editSubstituteTarget.period,
            subTeacherId: replacementTeacher.id,
            subTeacherName: replacementTeacher.name
          });
          if (!res || res.status !== "success") {
            throw new Error(res?.message || "เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง");
          }

          setHistory(prev => prev.map(record => {
            if (record.id !== editSubstituteTarget.recordId) return record;
            return {
              ...record,
              substitutes: record.substitutes.map(sub =>
                Number(sub.period) === Number(editSubstituteTarget.period)
                  ? { ...sub, subTeacherId: replacementTeacher.id, subTeacherName: replacementTeacher.name }
                  : sub
              )
            };
          }));
          setEditSubstituteTarget(null);
          setReplacementTeacherId("");

                      <td className="h-8 px-3 border border-black">{FORMAL_TEACHER_NAMES[teacher.id] || teacher.name}</td>
                      <td className="h-8 border border-black text-center font-bold">{monthlyTeacherCounts[teacher.id] || 0}</td>
                      <td className="h-8 border border-black"></td>
                    </tr>
                  ))}
                  <tr>
                    <td colSpan="2" className="h-9 border border-black text-center font-bold">รวมจำนวนคาบทั้งหมด</td>
                    <td className="h-9 border border-black text-center font-bold">{monthlyTeacherTotal}</td>
                    <td className="h-9 border border-black"></td>
                  </tr>
                </tbody>
              </table>

              <div className="mt-10 text-sm text-center space-y-8">
                <div>
                  <p>ลงชื่อ..............................................................</p>
                  <p className="mt-1">(นายรามิล ปัญญพัทธ์)</p>
                  <p>หัวหน้ากลุ่มสาระการเรียนรู้ภาษาไทย</p>
                </div>
                <div>
                  <p>ลงชื่อ..............................................................</p>
                  <p className="mt-1">(นางสาวภัทรพร ประมาตร)</p>
                  <p>รองผู้อำนวยการ กลุ่มบริหารวิชาการ</p>
                </div>
                <div>
                  <p>ลงชื่อ..............................................................</p>
                  <p className="mt-1">(นางสุภาพร รัตน์น้อย)</p>
                  <p>ผู้อำนวยการโรงเรียนพูลเจริญวิทยาคม</p>
                  <p className="mt-2">................/................/................</p>
                </div>
              </div>
            </div>
          )}

          {/* Minimalist modern footer */}
          <footer className="no-print bg-emerald-950/95 border-t border-amber-400/30 py-6 text-center text-xs text-emerald-100/70 mt-12">
            <p>© โรงเรียนพูลเจริญวิทยาคม • พัฒนาขึ้นเพื่อความเท่าเทียมและจัดสรรภาระงานกลุ่มสาระการเรียนรู้ภาษาไทย 1/2569</p>
          </footer>

          {/* Beautiful Custom Toast Notification */}
          {toast.show && (
            <div className="fixed bottom-5 right-5 z-[10000] max-w-md animate-slide-in no-print">
              <div className={`p-4 rounded-xl shadow-2xl flex items-center gap-3 border ${
                toast.type === "success" 
                  ? "bg-emerald-50 text-emerald-800 border-emerald-200" 
                  : toast.type === "warning"
                    ? "bg-amber-50 text-amber-800 border-amber-200"
                    : "bg-rose-50 text-rose-800 border-rose-200"
              }`}>
                <span className="text-xl">
                  {toast.type === "success" ? "✅" : toast.type === "warning" ? "⚠️" : "❌"}
                </span>
                <div className="font-semibold text-sm">{toast.message}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
